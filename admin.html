<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Админка</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="wrap">
  <header><h1>⚙️ Админка</h1><button id="logout" class="secondary hidden">Выйти</button></header>
  <section id="login" class="card">
    <h2>Вход</h2>
    <input id="password" type="password" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
    <p id="loginError" class="error"></p>
  </section>
  <main id="panel" class="hidden">
    <section class="card">
      <h2>Категории</h2>
      <form id="categoryForm">
        <input name="name" placeholder="Название категории" required>
        <input name="image" type="file" accept="image/png,image/jpeg,image/webp">
        <button>Добавить категорию</button>
      </form>
      <div id="categories"></div>
    </section>
    <section class="card">
      <h2>Добавить товар</h2>
      <form id="productForm">
        <input name="name" placeholder="Название товара" required>
        <textarea name="description" placeholder="Описание"></textarea>
        <input name="price" type="number" min="0" step="0.01" placeholder="Цена" required>
        <select name="category_id" id="categorySelect" required></select>
        <input name="image" type="file" accept="image/png,image/jpeg,image/webp">
        <button>Добавить товар</button>
      </form>
    </section>
    <section class="card">
      <h2>Товары</h2>
      <div id="products"></div>
    </section>
  </main>
</div>
<script src="/static/admin.js"></script>
</body>
</html>
